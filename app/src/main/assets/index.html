<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f6562" />
<title>Nos petites étoiles</title>
<style>
:root{color-scheme:light;--ink:#233449;--muted:#718092;--green:#117c76;--green2:#e3f6f2;--bg:#f7f7f4;--white:#fff;--line:#e9eee9;--sun:#efa943;--shadow:0 8px 32px rgba(31,57,56,.065)}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a1d9c8;outline-offset:2px}
.shell{width:100%;max-width:490px;margin:auto;min-height:100dvh;padding:0 18px 102px}.top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(20px + env(safe-area-inset-top));gap:10px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:2px;color:var(--green);font-weight:850;margin:0 0 5px}.brand{font-size:26px;line-height:1.1;letter-spacing:-.9px;font-weight:860}.brand span{color:var(--green)}.roundIcon{background:#eaf2ec;border:0;border-radius:16px;width:44px;height:44px;font-size:23px;display:grid;place-items:center}
.hello{margin:25px 0 13px}.hello h1{font-size:24px;letter-spacing:-.5px;line-height:1.2;margin:0 0 6px}.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.5}.children{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 20px}.child{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;border:2px solid transparent;background:white;border-radius:18px;padding:12px 11px;box-shadow:var(--shadow);transition:.15s}.child.active{border-color:var(--green);background:#f1fcf8}.face{display:grid;place-items:center;border-radius:14px;width:42px;height:42px;flex:0 0 auto;background:#fae8d7;font-size:23px}.child:nth-child(2) .face{background:#e3e9ff}.child b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:105px}.child small{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.hero{border-radius:23px;background:linear-gradient(130deg,#116c69,#199d8b);color:white;padding:23px 20px 20px;position:relative;overflow:hidden;box-shadow:0 12px 26px rgba(13,118,104,.16)}.hero:after{content:'✦';font-size:112px;line-height:1;position:absolute;right:-10px;top:20px;opacity:.12;transform:rotate(-15deg)}.heroHead{display:flex;justify-content:space-between;align-items:start;position:relative;z-index:1}.heroLabel{font-size:12px;opacity:.85}.heroPoints{font-size:37px;font-weight:900;line-height:1.1;letter-spacing:-1.1px;margin:7px 0 4px}.heroPoints span{font-size:16px;font-weight:600;letter-spacing:0;opacity:.9}.starBig{font-size:43px;filter:drop-shadow(0 3px 1px rgba(0,0,0,.07))}.heroFooter{display:flex;align-items:center;justify-content:space-between;margin-top:17px;gap:10px;font-size:12px;position:relative;z-index:1}.track{height:9px;background:#ffffff45;border-radius:20px;overflow:hidden;position:relative;z-index:1;margin-top:10px}.track>div{height:100%;border-radius:inherit;background:#ffe4a0;transition:width .3s}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.sectionTitle h2{font-size:18px;letter-spacing:-.35px;margin:0}.sectionTitle span{color:var(--muted);font-size:12px}.mission{border:1px solid var(--line);background:var(--white);box-shadow:var(--shadow);padding:16px 13px;margin-bottom:10px;border-radius:19px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:95px}.missionIcon{display:grid;place-items:center;width:51px;height:51px;font-size:26px;border-radius:16px;flex:0 0 auto}.missionIcon.paci{background:#fdf0e6}.missionIcon.tidy{background:#ebe8fb}.missionIcon.bed{background:#e7f2fd}.missionBody{flex:1;min-width:0}.missionTitle{font-size:15px;font-weight:830;display:block;margin-bottom:3px}.missionDesc{color:var(--muted);font-size:12px;line-height:1.4;display:block}.mark{display:grid;place-items:center;width:39px;height:39px;flex:0 0 auto;border-radius:13px;border:2px solid #e1e8e5;color:#bdc8c6;font-size:22px;background:#f9fbfa;transition:.15s}.mission.done{border-color:#b1e1cd;background:#f7fdf9}.mission.done .mark{border-color:#b6e7cc;background:#c8f2d8;color:#136e4f}.mission:active{transform:scale(.992)}
.note{display:flex;align-items:start;gap:9px;background:#fff5e8;border-radius:15px;padding:13px 14px;color:#92643d;font-size:12px;line-height:1.55;margin-top:13px}.note b{color:#785332}.pill{font-size:11px;background:#dcf6eb;color:#146c54;border-radius:30px;padding:5px 10px;font-weight:750}
.panel{background:white;border-radius:19px;padding:18px 15px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:13px}.weekNav{display:flex;align-items:center;justify-content:space-between;gap:10px}.arrow{border:0;border-radius:12px;background:#eff5f2;width:37px;height:37px;font-size:24px;color:var(--green)}.weekLabel{font-size:13px;font-weight:800;text-align:center}.matrix{width:100%;border-collapse:separate;border-spacing:0 9px;margin-top:12px}.matrix th{font-size:10px;color:#718092;font-weight:700;padding:2px}.matrix td{text-align:center;padding:0}.dayLbl{font-size:12px;text-align:left;min-width:62px;font-weight:700}.square{border:1px solid #e8eee9;border-radius:12px;background:#f6f8f5;color:#c2cfca;width:38px;height:37px;display:inline-grid;place-items:center;font-size:19px}.square.on{background:#e4f7eb;border-color:#c4e8d1;color:#159464}.square.future{opacity:.3}.todayDot{display:inline-block;width:5px;height:5px;border-radius:99px;background:#e39f35;margin-left:4px;vertical-align:middle}.summary{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:8px;color:var(--muted);font-size:12px}.summary strong{color:var(--green)}
.reward{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;display:flex;align-items:center;gap:13px}.reward .rewardIcon{background:#fff1d8;border-radius:15px;width:52px;height:52px;display:grid;place-items:center;font-size:26px;flex:0 0 auto}.rewardBody{flex:1}.rewardTitle{font-weight:800;font-size:14px;margin-bottom:4px}.rewardSub{font-size:12px;color:var(--muted)}.reward button{border:0;border-radius:12px;background:#e7f3f0;color:var(--green);padding:10px 12px;font-weight:800;font-size:12px}.reward button:disabled{background:#f5f5f4;color:#aeb6b1;cursor:default}.reward.claimed{opacity:.7}.miniHelp{color:var(--muted);line-height:1.55;font-size:12px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:750;margin-bottom:17px}.field input,.field select,.field textarea{border:1px solid #dce6df;background:#fafcfb;padding:12px 13px;border-radius:13px;color:var(--ink);width:100%}.field textarea{resize:vertical;min-height:73px}.save{width:100%;border:0;border-radius:15px;background:#147b71;color:white;font-weight:800;padding:14px;margin-top:4px}.danger{background:#fff;border:1px solid #e6cdcd;color:#a14d4d}.secondary{width:100%;border:1px solid #d7e6df;border-radius:13px;background:white;padding:12px;font-size:13px;color:#16685f;font-weight:750;margin:6px 0}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:490px;margin:auto;background:#fff;border-top:1px solid #e9efeb;padding:9px 12px calc(11px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:30;box-shadow:0 -4px 24px rgba(50,62,54,.035)}.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8c969b;font-size:10px;font-weight:780;padding:7px 2px;border-radius:13px}.tab i{font-style:normal;font-size:22px}.tab.active{color:var(--green);background:#edf8f3}.empty{color:var(--muted);font-size:13px;line-height:1.5}.toast{position:fixed;z-index:60;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(22px);background:#273a3c;color:white;padding:12px 17px;border-radius:40px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;white-space:nowrap;box-shadow:0 8px 30px #0002}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modalShade{position:fixed;inset:0;background:#0c2b2d75;z-index:50;display:grid;place-items:center;padding:25px}.modal{width:100%;max-width:380px;border-radius:24px;background:white;padding:25px;text-align:center}.modal h3{margin:4px 0 8px}.modal p{font-size:13px;color:var(--muted);line-height:1.6}.modal .buttons{display:flex;gap:10px;margin-top:20px}.modal .buttons button{flex:1;border-radius:13px;border:none;padding:13px;font-weight:800;background:#edf3ef;color:#46635b}.modal .buttons button.primary{background:#147b71;color:white}.small{font-size:11px;color:var(--muted)}.hide{display:none}.topBack{border:0;background:none;color:var(--green);font-weight:800;font-size:12px;padding:8px 0}footer{font-size:11px;color:#8b9996;text-align:center;padding:12px}.starpop{position:fixed;inset:0;pointer-events:none;z-index:90;display:grid;place-items:center;font-size:62px;animation:pop .8s ease-out forwards}@keyframes pop{0%{transform:scale(.25);opacity:0}35%{transform:scale(1.3);opacity:1}100%{transform:scale(1.7) translateY(-40px);opacity:0}}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="dialog"></div>
<script>
(function(){'use strict';
const STORE='nos-petites-etoiles-v1';
const missions=[{id:'paci',icon:'🧸',title:'Tétine',subtitle:(kid)=>`Jouer ${kid.minutes} minutes sans tétine`,weekday:'🧸'},{id:'tidy',icon:'🧩',title:'Rangement',subtitle:()=> 'Ranger quelques jouets après une consigne',weekday:'🧩'},{id:'bed',icon:'🌙',title:'Coucher',subtitle:()=> 'Mettre le pyjama et rejoindre son lit',weekday:'🌙'}];
const defaults=()=>({active:0,tab:'today',weekOffset:0,kids:[{name:'Thyam',emoji:'🦊',minutes:5,marks:{},claims:{}},{name:'Son frère',emoji:'🐻',minutes:5,marks:{},claims:{}}]});
let state=load(); let tid=0;
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x && Array.isArray(x.kids) && x.kids.length===2)return {...defaults(),...x,kids:x.kids.map((k,i)=>({...defaults().kids[i],...k}))};}catch(e){}return defaults()}
function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){toast('Enregistrement indisponible sur cet appareil');}}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayISO(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function monday(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate() - (d.getDay()+6)%7);return d}
function addDays(day,n){const d=new Date(day);d.setDate(d.getDate()+n);return d}
function weekDate(){return addDays(monday(new Date()),7*(state.weekOffset||0))}
function weekDates(){return Array.from({length:7},(_,i)=>addDays(weekDate(),i))}
function marksForWeek(k,day){return missions.filter(m=>k.marks[`${dayISO(day)}|${m.id}`]).length}
function total(k,days){return days.reduce((t,d)=>t+marksForWeek(k,d),0)}
function activeKid(){return state.kids[state.active]}
const rewards=[{at:3,icon:'🎲',name:'Choisir un jeu avec papa',about:'Une petite victoire à partager'},{at:9,icon:'🧁',name:'Choisir une activité à la maison',about:'Cuisine, construction ou jeu'},{at:15,icon:'🎈',name:'Choisir une sortie du week-end',about:'Une activité choisie ensemble'}];
function progress(count){return Math.min(count/21*100,100)}
function longDate(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function weekTitle(){const d=weekDates();return `${d[0].toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${d[6].toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}`}
function childButtons(){return `<div class="children">${state.kids.map((kid,i)=>`<button type="button" class="child ${state.active===i?'active':''}" onclick="App.child(${i})" aria-pressed="${state.active===i}"><span class="face">${kid.emoji}</span><span><b>${escapeHTML(kid.name)}</b><small>${total(kid,weekDates())} étoiles cette semaine</small></span></button>`).join('')}</div>`}
function cardHeader(h,sub){return `<div class="sectionTitle"><h2>${h}</h2><span>${sub||''}</span></div>`}
function hero(k){const n=total(k,weekDates());return `<div class="hero"><div class="heroHead"><div><div class="heroLabel">Les étoiles de ${escapeHTML(k.name)}</div><div class="heroPoints">${n} <span>/ 21 ⭐</span></div></div><div class="starBig">🌟</div></div><div class="heroFooter"><span>${n>=15?'Bravo, grande récompense débloquée !':n>=9?'Super, continue comme ça !':n>=3?'Bien joué, tu progresses !':'Chaque petit effort compte 💚'}</span><span>${Math.round(progress(n))}%</span></div><div class="track"><div style="width:${progress(n)}%"></div></div></div>`}
function today(k){const today=new Date();const day=dayISO(today);return `${cardHeader('Mes missions', 'Aujourd’hui')}<div>${missions.map(m=>{const isDone=!!k.marks[`${day}|${m.id}`];return `<button type="button" class="mission ${isDone?'done':''}" onclick="App.mark('${m.id}','${day}')"><span class="missionIcon ${m.id}">${m.icon}</span><span class="missionBody"><span class="missionTitle">${m.title}</span><span class="missionDesc">${escapeHTML(m.subtitle(k))}</span></span><span class="mark">${isDone?'★':'☆'}</span></button>`}).join('')}</div><div class="note"><span>💛</span><span><b>On encourage les efforts !</b> Les étoiles restent acquises. Une crise ou une journée difficile ne retire pas les réussites précédentes.</span></div>`}
function week(k){const days=weekDates();const todayISO=dayISO(new Date());const headers=['Tétine','Ranger','Dodo'];return `<div class="panel"><div class="weekNav"><button class="arrow" aria-label="Semaine précédente" onclick="App.week(-1)">‹</button><div class="weekLabel">${weekTitle()}<div class="small">${state.weekOffset===0?'Cette semaine':'Historique des progrès'}</div></div><button class="arrow" aria-label="Semaine suivante" onclick="App.week(1)" ${state.weekOffset>=0?'disabled style="opacity:.25"':''}>›</button></div><table class="matrix"><thead><tr><th style="text-align:left">Jour</th>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${days.map((d)=>{const day=dayISO(d);return `<tr><td class="dayLbl">${d.toLocaleDateString('fr-FR',{weekday:'short'})} ${d.getDate()} ${todayISO===day?'<span class="todayDot"></span>':''}</td>${missions.map(m=>{const marked=!!k.marks[`${day}|${m.id}`];const future=day>todayISO;return `<td><button class="square ${marked?'on':''} ${future?'future':''}" aria-label="${m.title} ${day}${marked?', étoile gagnée':''}" ${future?'disabled':''} onclick="App.mark('${m.id}','${day}')">${marked?'★':'☆'}</button></td>`}).join('')}</tr>`}).join('')}</tbody></table><div class="summary"><span>Étoiles gagnées cette semaine</span><strong>${total(k,days)} / 21 ⭐</strong></div></div><p class="miniHelp">Appuie sur une étoile pour noter une mission réussie. Une étoile déjà attribuée peut être corrigée en cas d'erreur de saisie.</p>`}
function rewardTab(k){const points=total(k,weekDates());const key=dayISO(weekDate());return `${cardHeader('Petites récompenses', 'Cumulées')}<div>${rewards.map(r=>{const can=points>=r.at;const claimed=!!k.claims[`${key}|${r.at}`];return `<div class="reward ${claimed?'claimed':''}"><div class="rewardIcon">${r.icon}</div><div class="rewardBody"><div class="rewardTitle">${escapeHTML(r.name)}</div><div class="rewardSub">${r.at} étoiles · ${claimed?'Déjà offerte':can?'Débloquée !':'Encore '+(r.at-points)+' étoile(s)'}</div></div><button ${(!can||claimed)?'disabled':''} onclick="App.claim(${r.at})">${claimed?'✓ Offerte':can?'Offrir':'🔒'}</button></div>`}).join('')}</div><p class="miniHelp">Les récompenses sont cumulables et ne coûtent pas d'étoiles. Évite les cadeaux coûteux : choisir un moment agréable ensemble suffit souvent.</p>`}
function settings(k){return `${cardHeader('Personnaliser', 'Pour chaque enfant')}<div class="panel"><label class="field">Prénom<input id="kidName" maxlength="24" value="${escapeHTML(k.name)}"></label><label class="field">Objectif tétine (minutes sans tétine)<select id="paciMinutes">${[2,5,10,15,20,30,45,60,120].map(x=>`<option value="${x}" ${k.minutes===x?'selected':''}>${x} minute${x>1?'s':''}</option>`).join('')}</select></label><p class="miniHelp" style="margin-top:0">Commence à 2 ou 5 minutes pendant un moment calme, puis augmente doucement. Pas de retrait de tétine comme punition.</p><button class="save" onclick="App.settingsSave()">Enregistrer</button></div>${cardHeader('Mes données')}<div class="panel"><button class="secondary" onclick="App.backup()">📋 Copier une sauvegarde</button><button class="secondary" onclick="App.restore()">📥 Restaurer une sauvegarde</button><button class="secondary danger" onclick="App.reset()">Réinitialiser les étoiles</button><p class="miniHelp">Les progrès sont enregistrés uniquement sur cet appareil, sans compte ni connexion Internet. Faire une sauvegarde avant de changer de téléphone.</p></div>`}
function render(){const k=activeKid();const now=new Date();document.getElementById('shell').innerHTML=`<header class="top"><div><div class="eyebrow">Notre petit rituel</div><div class="brand">Nos petites <span>étoiles ✦</span></div></div><div class="roundIcon" aria-hidden="true">🌈</div></header><div class="hello"><h1>${{today:'Bonjour les champions !',week:'Toutes nos étoiles',rewards:'Des petits bonheurs',settings:'À notre rythme'}[state.tab]}</h1><p class="hint">${{today:`${longDate(now)} · Chaque effort compte`,week:'On regarde les progrès, sans pression',rewards:'Les bons moments se partagent',settings:'Des objectifs adaptés à chacun'}[state.tab]}</p></div>${childButtons()}${state.tab==='today'?hero(k)+today(k):state.tab==='week'?week(k):state.tab==='rewards'?hero(k)+rewardTab(k):settings(k)}<footer>Fait pour encourager, jamais pour punir 💚</footer>`;
const tabs=[['today','🏡','Aujourd’hui'],['week','🗓️','Semaine'],['rewards','🎁','Cadeaux'],['settings','⚙️','Réglages']];
let old=document.querySelector('.nav');if(old)old.remove();
const nav=document.createElement('nav');nav.className='nav';nav.setAttribute('aria-label','Navigation principale');
nav.innerHTML=tabs.map(([key,icon,label])=>`<button class="tab ${state.tab===key?'active':''}" onclick="App.tab('${key}')"><i aria-hidden="true">${icon}</i>${label}</button>`).join('');document.body.appendChild(nav);
}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(tid);tid=setTimeout(()=>el.classList.remove('show'),2400)}
function dialog(title,msg,yes,no='Annuler'){return new Promise(resolve=>{const el=document.getElementById('dialog');el.innerHTML=`<div class="modalShade"><div class="modal" role="dialog" aria-modal="true"><h3>${escapeHTML(title)}</h3><p>${escapeHTML(msg)}</p><div class="buttons"><button id="cancel">${escapeHTML(no)}</button><button id="accept" class="primary">${escapeHTML(yes)}</button></div></div></div>`;const close=v=>{el.innerHTML='';resolve(v)};document.getElementById('cancel').onclick=()=>close(false);document.getElementById('accept').onclick=()=>close(true)})}
function starAnim(){let e=document.createElement('div');e.className='starpop';e.textContent='🌟';document.body.append(e);setTimeout(()=>e.remove(),850);if(navigator.vibrate)navigator.vibrate(45)}
window.App={
child(i){state.active=i;saveState();render()},
tab(s){state.tab=s;if(s==='week')state.weekOffset=0;saveState();render();window.scrollTo(0,0)},
week(n){state.weekOffset=Math.min(0,state.weekOffset+n);saveState();render()},
async mark(mid,date){if(date>dayISO(new Date()))return;const k=activeKid();const key=`${date}|${mid}`;
if(k.marks[key]){if(await dialog('Corriger une étoile ?',"Une étoile a déjà été attribuée. L'enlever uniquement en cas d'erreur de saisie ?",'Corriger')){delete k.marks[key];saveState();render();toast('Saisie corrigée')}}
else{k.marks[key]=true;saveState();render();starAnim();toast('Bravo '+k.name+' ! Une étoile gagnée ⭐')}},
async claim(at){const k=activeKid(),r=rewards.find(x=>x.at===at),key=`${dayISO(weekDate())}|${at}`;
if(!r||total(k,weekDates())<at||k.claims[key])return;
if(await dialog('Offrir la récompense ?',`${k.name} a débloqué : ${r.name}. Marquer comme offerte ?`,'Oui, offerte')){k.claims[key]=true;saveState();render();toast('Une belle récompense 🎁')}},
settingsSave(){const k=activeKid(),input=document.getElementById('kidName');let name=input.value.trim();if(!name){toast('Indique un prénom');return}k.name=name.slice(0,24);k.minutes=Number(document.getElementById('paciMinutes').value);saveState();render();toast('Réglages enregistrés ✓')},
async backup(){const data=JSON.stringify({version:1,kids:state.kids},null,2);try{if(navigator.clipboard&&location.protocol!=='file:'){await navigator.clipboard.writeText(data);toast('Sauvegarde copiée ✓');return}}catch(e){}
let el=document.getElementById('dialog');el.innerHTML=`<div class="modalShade"><div class="modal" role="dialog" aria-modal="true"><h3>Sauvegarde</h3><p>Copie ce texte et conserve-le dans une note.</p><textarea id="backupData" style="width:100%;height:140px;font-size:11px;word-break:break-all" readonly></textarea><div class="buttons"><button id="closeBackup" class="primary">Fermer</button></div></div></div>`;document.getElementById('backupData').value=data;document.getElementById('backupData').select();document.getElementById('closeBackup').onclick=()=>el.innerHTML=''},
restore(){let el=document.getElementById('dialog');el.innerHTML=`<div class="modalShade"><div class="modal" role="dialog" aria-modal="true"><h3>Restaurer une sauvegarde</h3><p>Colle les données copiées précédemment. Cela remplacera les progrès actuels.</p><textarea id="restoreData" style="width:100%;height:135px" placeholder="Colle le texte JSON ici"></textarea><div class="buttons"><button id="closeRestore">Annuler</button><button id="saveRestore" class="primary">Restaurer</button></div></div></div>`;document.getElementById('closeRestore').onclick=()=>el.innerHTML='';document.getElementById('saveRestore').onclick=()=>{try{let d=JSON.parse(document.getElementById('restoreData').value);if(!Array.isArray(d.kids)||d.kids.length!==2||d.kids.some(k=>typeof k.name!=='string'||typeof k.marks!=='object'||!k.marks||typeof k.claims!=='object'||!k.claims))throw Error();state.kids=d.kids.map((k,i)=>({...defaults().kids[i],name:k.name.slice(0,24),minutes:[2,5,10,15,20,30,45,60,120].includes(Number(k.minutes))?Number(k.minutes):5,marks:k.marks,claims:k.claims}));saveState();el.innerHTML='';render();toast('Sauvegarde restaurée ✓')}catch(e){toast('Sauvegarde invalide')}}},
async reset(){if(await dialog('Effacer toutes les étoiles ?',"Cela effacera les étoiles et les récompenses des deux enfants. Impossible d'annuler.",'Tout effacer')){state.kids.forEach(k=>{k.marks={};k.claims={}});saveState();render();toast('Tableaux remis à zéro')}}
};
render();
})();
</script>
</body>
</html>
